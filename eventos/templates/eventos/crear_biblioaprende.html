{% extends 'base.html' %}

{% block content %}
<style>
        body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
        padding: 40px;
    }

    .form-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="time"],
    select,
    textarea,
    input[type="file"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 15px;
        background-color: #fdfdfd;
        transition: border 0.2s;
    }

    input:focus, textarea:focus, select:focus {
        border-color: #007bff;
        outline: none;
    }

    .errorlist {
        color: red;
        font-size: 0.9em;
        margin-bottom: 10px;
    }

    button[type="submit"] {
        background-color: #007bff;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        display: block;
        margin: 0 auto;
        transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
        background-color: #0056b3;
    }
</style>

<div class="form-container">
    <h2>Nuevo evento Biblio Aprende</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.non_field_errors }}

        {% for field in form %}
            <div>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <button type="submit">Guardar evento</button>
    </form>
</div>

{% if messages %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    {% for message in messages %}
        Swal.fire({
            icon: '{% if "success" in message.tags %}success{% elif "error" in message.tags %}error{% else %}info{% endif %}',
            title: '{{ message|escapejs }}',
            confirmButtonColor: '#3085d6',
            confirmButtonText: 'Aceptar'
        });
    {% endfor %}
</script>
{% endif %}

{% endblock %}
