{% extends "base.html" %}
{% load static tailwind_filters %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat" style="background-image: url('{% static 'images/biblioteca.png' %}');">
    <div class="max-w-2xl w-full mx-4 bg-white bg-opacity-90 p-8 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-8">
            Agregar Nueva Biblioteca
        </h1>

        <form action="{% url 'add_biblioteca' %}" method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form|crispy }}
            </div>

            <button
                class="w-full mt-6 inline-block rounded-sm border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white hover:bg-transparent hover:text-indigo-600 focus:ring-3 focus:outline-none"
                type="submit"
            >
                Guardar
            </button>
        </form>
    </div>
</div>

{% endblock content %}
