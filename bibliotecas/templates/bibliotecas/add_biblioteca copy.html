{% extends "base_admin.html" %}
{% load static tailwind_filters %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="max-w-4xl w-full flex bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat" style="background-image: url('{% static 'images/biblioteca.png' %}'); background-size: contain;">
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-8">
            Agregar Nueva Biblioteca
        </h1>
        <form action="{% url 'add_biblioteca' %}" method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form|crispy }}
            </div>

            <button
                class="w-full mt-6 inline-block rounded-sm border border-red-600 bg-red-900 px-12 py-3 text-sm font-medium text-white hover:bg-transparent hover:text-red-600 focus:ring-3 focus:outline-none"
                type="submit"
            >
                Guardar
            </button>
        </form>
        </div>
    </div>
</div>


{% endblock content %}
